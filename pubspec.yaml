name: chinese_poker_ui
description: Flutter frontend for the local human-vs-bot Chinese Poker game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  palette_generator: ^0.3.3+7
  playing_cards: 0.4.1+11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
